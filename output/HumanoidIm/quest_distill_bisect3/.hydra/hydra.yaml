hydra:
  run:
    dir: output/HumanoidIm/${exp_name}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=RUN
    task:
    - learning=distill_quest
    - exp_name=quest_distill_bisect3
    - env=env_quest_im_basic
    - robot=quest_humanoid
    - env.motion_file=/tmp/claude-1000/-home-sia-irl-AvatarPoser/c46f5c71-949c-4f51-b8db-2691e396a224/scratchpad/quest_smoke_motion.pkl
    - env.num_envs=64
    - env.cycle_motion=True
    - env.min_length=5
    - learning.params.config.minibatch_size=256
    - learning.params.config.amp_batch_size=256
    - learning.params.config.amp_minibatch_size=256
    - learning.params.config.save_frequency=100000
    - +learning.params.config.debug_env_step_only=True
    - headless=True
    - no_virtual_display=True
    - no_log=True
    - disable_multiprocessing=False
    - test=False
    - im_eval=False
  job:
    name: ${exp_name}
    chdir: null
    override_dirname: +learning.params.config.debug_env_step_only=True,disable_multiprocessing=False,env.cycle_motion=True,env.min_length=5,env.motion_file=/tmp/claude-1000/-home-sia-irl-AvatarPoser/c46f5c71-949c-4f51-b8db-2691e396a224/scratchpad/quest_smoke_motion.pkl,env.num_envs=64,env=env_quest_im_basic,exp_name=quest_distill_bisect3,headless=True,im_eval=False,learning.params.config.amp_batch_size=256,learning.params.config.amp_minibatch_size=256,learning.params.config.minibatch_size=256,learning.params.config.save_frequency=100000,learning=distill_quest,no_log=True,no_virtual_display=True,robot=quest_humanoid,test=False
    id: ???
    num: ???
    config_name: config
    env_set:
      OMP_NUM_THREADS: '1'
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.3
    version_base: '1.3'
    cwd: /home/sia-irl/AvatarPoser/phc
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /home/sia-irl/AvatarPoser/phc/phc/data/cfg
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /home/sia-irl/AvatarPoser/phc/output/HumanoidIm/quest_distill_bisect3
    choices:
      domain_rand: default_dr
      control: default_control
      sim: default_sim
      learning: distill_quest
      robot: quest_humanoid
      env: env_quest_im_basic
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
