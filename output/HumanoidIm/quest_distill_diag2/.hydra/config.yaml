project_name: PHC
notes: Default Notes
exp_name: quest_distill_diag2
headless: true
seed: 0
no_log: true
resume_str: null
num_threads: 64
test: false
dataset: false
mlp: false
output_path: output/HumanoidIm/${exp_name}
torch_deterministic: false
epoch: 0
im_eval: false
horovod: false
rl_device: cuda:0
device: cuda
device_id: 0
metadata: false
play: ${test}
train: true
collect_dataset: false
disable_multiprocessing: false
server_mode: false
has_eval: true
no_virtual_display: true
render_o3d: false
debug: false
follow: false
add_proj: false
real_traj: false
env:
  task: HumanoidImQuest
  project_name: PHC
  notes: ''
  motion_file: /home/sia-irl/AvatarPoser/data/quest2_synthetic/train_seg_motion
  num_envs: 64
  env_spacing: 5
  episode_length: 300
  is_flag_run: false
  enable_debug_vis: false
  fut_tracks: false
  self_obs_v: 1
  obs_v: 6
  amp_obs_v: 1
  auto_pmcp: false
  auto_pmcp_soft: true
  cycle_motion: true
  hard_negative: false
  min_length: 5
  kp_scale: 1
  power_reward: true
  shape_resampling_interval: 500
  control_mode: isaac_pd
  power_scale: 1.0
  controlFrequencyInv: 2
  stateInit: Random
  hybridInitProb: 0.5
  numAMPObsSteps: 10
  has_upright_start: false
  local_root_obs: true
  root_height_obs: false
  key_bodies:
  - b_l_foot_twist
  - b_r_foot_twist
  - b_l_wrist_twist
  - b_r_wrist_twist
  contact_bodies:
  - b_l_foot_twist
  - b_r_foot_twist
  reset_bodies:
  - b_spine0
  - b_spine1
  - b_spine2
  - b_spine3
  - b_neck0
  - b_head
  - b_l_shoulder
  - p_l_scap
  - b_l_arm
  - b_l_forearm
  - b_l_wrist_twist
  - b_l_wrist
  - b_r_shoulder
  - p_r_scap
  - b_r_arm
  - b_r_forearm
  - b_r_wrist_twist
  - b_r_wrist
  - b_l_upleg
  - b_l_leg
  - b_r_upleg
  - b_r_leg
  terminationHeight: 0.15
  enableEarlyTermination: true
  terminationDistance: 0.25
  numTrajSamples: 3
  trajSampleTimestepInv: 3
  enableTaskObs: true
  plane:
    staticFriction: 1.0
    dynamicFriction: 1.0
    restitution: 0.0
robot:
  humanoid_type: quest
  bias_offset: false
  has_self_collision: true
  has_mesh: false
  has_jt_limit: false
  has_dof_subset: true
  has_upright_start: false
  has_smpl_pd_offset: false
  remove_toe: false
  motion_sym_loss: false
  sym_loss_coef: 1
  big_ankle: true
  has_shape_obs: false
  has_shape_obs_disc: false
  has_shape_variation: false
  masterfoot: false
  freeze_toe: false
  freeze_hand: false
  box_body: true
  real_weight: true
  real_weight_porpotion_capsules: true
  real_weight_porpotion_boxes: true
  asset:
    assetRoot: ./
    assetFileName: phc/data/assets/mjcf/quest_humanoid.xml
learning:
  params:
    seed: 0
    algo:
      name: distill_quest
    model:
      name: amp
    network:
      name: amp
      separate: true
      space:
        continuous:
          mu_activation: None
          sigma_activation: None
          mu_init:
            name: default
          sigma_init:
            name: const_initializer
            val: -2.9
          fixed_sigma: true
          learn_sigma: false
      mlp:
        units:
        - 3092
        - 2048
        - 1024
        activation: silu
        d2rl: false
        initializer:
          name: default
        regularizer:
          name: None
      disc:
        units:
        - 2048
        - 1024
        activation: relu
        initializer:
          name: default
    load_checkpoint: false
    config:
      name: Humanoid
      env_name: rlgpu
      multi_gpu: false
      ppo: true
      mixed_precision: false
      normalize_input: true
      normalize_value: true
      reward_shaper:
        scale_value: 1
      normalize_advantage: true
      gamma: 0.99
      tau: 0.95
      learning_rate: 2.0e-05
      lr_schedule: constant
      score_to_win: 20000
      max_epochs: 10000000
      save_best_after: 100
      save_frequency: 100000
      print_stats: false
      save_intermediate: true
      entropy_coef: 0.0
      truncate_grads: true
      grad_norm: 50.0
      e_clip: 0.2
      horizon_length: 32
      minibatch_size: 256
      mini_epochs: 6
      critic_coef: 5
      clip_value: false
      bounds_loss_coef: 10
      amp_obs_demo_buffer_size: 200000
      amp_replay_buffer_size: 200000
      amp_replay_keep_prob: 0.01
      amp_batch_size: 256
      amp_minibatch_size: 256
      disc_coef: 5
      disc_logit_reg: 0.01
      disc_grad_penalty: 5
      disc_reward_scale: 2
      disc_weight_decay: 0.0001
      normalize_amp_input: true
      task_reward_w: 0.5
      disc_reward_w: 0.5
      amp_dropout: true
      student_lr: 0.0001
      backbone_lr: 0.0001
      lambda_action: 0.1
      kinematic_root_weight: 0.02
      freeze_backbone: false
      avatarposer_checkpoint: ../results/AvatarPoseEstimationQuest2/models/15000_G.pth
      teacher_checkpoint: ../output/HumanoidIm/phc_prim_quest/Humanoid.pth
      window_size: 40
      stage_e_step: 100000
      stage_r_step: 0
      student_checkpoint: ''
      player:
        games_num: 999999999999999999999999
sim:
  sim_device: cuda:0
  pipeline: gpu
  graphics_device_id: 0
  subscenes: 0
  slices: 0
  use_flex: false
  substeps: 2
  physx:
    step_dt: 1/60
    num_threads: 4
    solver_type: 1
    num_position_iterations: 4
    num_velocity_iterations: 0
    contact_offset: 0.02
    rest_offset: 0.0
    bounce_threshold_velocity: 0.2
    max_depenetration_velocity: 10.0
    default_buffer_size_multiplier: 10.0
  flex:
    num_inner_iterations: 10
    warm_start: 0.25
control:
  action_filter: false
  action_scale: 1
  decimation: 2
  action_cutfreq: 4.0
  control_mode: isaac_pd
domain_rand:
  has_domain_rand: false
  push_robots: false
  push_interval_s: 5
  max_push_vel_xy: 0.3
  randomize_friction: false
  friction_range:
  - -0.6
  - 1.2
  randomize_base_mass: false
  added_mass_range:
  - -5.0
  - 10.0
  randomize_base_com: false
  base_com_range:
    x:
    - -0.1
    - 0.1
    'y':
    - -0.1
    - 0.1
    z:
    - -0.2
    - 0.2
  randomize_link_mass: false
  link_mass_range:
  - 0.7
  - 1.3
  randomize_link_body_names:
  - pelvis
  - left_hip_yaw_link
  - left_hip_roll_link
  - left_hip_pitch_link
  - right_hip_yaw_link
  - right_hip_roll_link
  - right_hip_pitch_link
  - torso_link
  randomize_pd_gain: false
  kp_range:
  - 0.75
  - 1.25
  kd_range:
  - 0.75
  - 1.25
  randomize_torque_rfi: false
  rfi_lim: 0.1
  randomize_rfi_lim: false
  rfi_lim_range:
  - 0.5
  - 1.5
  randomize_ctrl_delay: false
  ctrl_delay_step_range:
  - 1
  - 3
  add_noise: false
  noise_level: 1.0
  noise_scales:
    base_z: 0.05
    dof_pos: 0.01
    dof_vel: 0.1
    lin_vel: 0.2
    ang_vel: 0.5
    gravity: 0.1
    in_contact: 0.1
    height_measurements: 0.05
    body_pos: 0.01
    body_lin_vel: 0.01
    body_rot: 0.001
    delta_base_pos: 0.05
    delta_heading: 0.1
    last_action: 0.0
    ref_body_pos: 0.05
    ref_body_rot: 0.01
    ref_lin_vel: 0.01
    ref_ang_vel: 0.01
    ref_dof_pos: 0.01
    ref_dof_vel: 0.01
    ref_gravity: 0.01
